<!doctype html>
<html lang="ru" dark>
<head>
<meta charset="utf-8" />
<title>Стенд: очередь на странице YouTube</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=block" />
<style>
  body { margin: 0; background: #0f0f0f; font-family: Roboto, Arial, sans-serif; }
  ytd-watch-flexy { display: flex; align-items: flex-start; }
  #movie_player { position: relative; width: 860px; height: 484px; margin: 16px; background: #1b2233; border-radius: 12px; }
  #movie_player video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  #secondary { width: var(--w, 460px); margin: 16px; }
</style>
</head>
<body>
<!-- колонка очереди над рекомендациями (queue.js) и подборка «Что дальше» поверх плеера -->
<ytd-watch-flexy><div id="movie_player"><video></video></div><div id="secondary"><div id="secondary-inner"></div></div></ytd-watch-flexy>
<script src="/tools/align/stands/queue-stub.js"></script>
<script src="/queue.js"></script>
</body>
</html>
