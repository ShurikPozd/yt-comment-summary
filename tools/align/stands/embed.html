<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Стенд: встроенный плеер «Моей библиотеки»</title>
<!-- Макет нового встроенного плеера YouTube (ноябрь 2026): панель управления — отдельный
     слой #player-controls поверх #movie_player (как на живом youtube.com/embed),
     ⚙ — button.player-settings-icon в строке сверху справа. Классы — с живого плеера. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=block" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: Roboto, Arial, sans-serif; }
  body { position: absolute; inset: 0; }
  #player { position: absolute; inset: 0; }
  #movie_player { position: relative; z-index: 0; width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(135deg, #3a4a6b, #1b2233); }
  #movie_player video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  /* слой управления — позже в разметке и поверх всего плеера (свой слой с z-index: 0) */
  #player-controls { position: fixed; inset: 0; }
  .player-controls-background-container { position: absolute; inset: 0; z-index: 0; }
  .player-controls-background { position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(rgba(0,0,0,.45), transparent 22%, transparent 70%, rgba(0,0,0,.5)); }
  .player-controls-top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 18px; height: 48px; }
  .ttl { color: #fff; font: 700 18px/1.2 Roboto, Arial, sans-serif; }
  .player-controls-top-right { display: flex; align-items: center; }
  .icon-button, .ytdVolumeControlsMuteIconButton, .ytmClosedCaptioningButtonButton { width: 48px; height: 48px; padding: 0; border: 0; background: none; color: #fff; cursor: pointer; }
  .player-controls-top-right svg { width: 24px; height: 24px; display: block; margin: auto; }
  .player-controls-bottom { position: absolute; left: 30px; bottom: 92px; z-index: 3; color: #fff; font: 500 13px Roboto, Arial, sans-serif; }
  yt-progress-bar.ytPlayerProgressBarHost { position: absolute; left: 30px; right: 30px; bottom: 70px; height: 16px; z-index: 3; display: block; }
  .ytPlayerProgressBarProgressBar { position: absolute; left: 0; right: 0; top: 6px; height: 4px; background: rgba(255,255,255,.4); }
  .ytPlayerProgressBarProgressBar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 29%; background: #f03; }
</style>
</head>
<body>
  <div id="player"><div id="movie_player" class="html5-video-player"><video class="html5-main-video"></video></div></div>
  <div id="player-controls" class="ytPlayerControlsContainerHost">
    <div class="player-controls-background-container"><div class="player-controls-background"></div></div>
    <div class="player-controls-content">
      <player-top-controls class="ytwPlayerTopControlsHost">
        <div class="player-controls-top">
          <div class="ttl">Как построить уютный дом</div>
          <div class="player-controls-top-right">
            <volume-controls><button class="ytdVolumeControlsMuteIconButton" aria-label="Отключить звук"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button></volume-controls>
            <yt-closed-captions-toggle-button><button class="ytmClosedCaptioningButtonButton" aria-label="Субтитры"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/></svg></button></yt-closed-captions-toggle-button>
            <div><button class="icon-button player-settings-icon" aria-label="Настройки воспроизведения"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg></button></div>
          </div>
        </div>
      </player-top-controls>
      <div class="player-controls-bottom"><span class="ytwPlayerTimeDisplayTimeElapsed">1:01</span> <span class="ytwPlayerTimeDisplayTimeDelimiter">/</span> <span class="ytwPlayerTimeDisplayTimeDuration">3:33</span></div>
      <yt-progress-bar class="ytPlayerProgressBarHost"><div class="ytPlayerProgressBarProgressBar"></div></yt-progress-bar>
    </div>
  </div>

<!-- заглушка chrome.* (общая со стендом YouTube); модули — из /tools/align/embed-js/: serve.py
     отдаёт их с проверкой «встроенный плеер — наш» (рамка внутри страницы расширения), заменённой на «да» -->
<script src="/tools/align/stands/yt-stub.js"></script>
<script src="/tools/align/embed-js/content.js"></script>
<script src="/sleep-core.js"></script>
<script src="/tools/align/embed-js/sleep.js"></script>
<script src="/tools/align/embed-js/limit.js"></script>
<script src="/volume-core.js"></script>
<script src="/audio-graph.js"></script>
<script src="/tools/align/embed-js/volume.js"></script>
<script src="/notes-core.js"></script>
<script src="/tools/align/embed-js/notes.js"></script>
<script src="/ctxmenu-core.js"></script>
<script src="/tools/align/embed-js/ctxmenu.js"></script>
</body>
</html>
